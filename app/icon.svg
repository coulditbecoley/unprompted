<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Unprompted favicon. Near-black ground so the mark holds on any browser
       chrome, light or dark. One step takes the board's full-intensity
       colour: the step that counts is deliberately not the tallest. -->
  <rect width="32" height="32" fill="#08090A"/>
  <g transform="translate(4 4)">
    <rect x="0"    y="0"     width="4.5" height="24"   fill="#F7F8F8"/>
    <rect x="6.5"  y="10.8"  width="4.5" height="13.2" fill="#F7F8F8"/>
    <rect x="13"   y="5.3"   width="4.5" height="18.7" fill="#9DC4E8"/>
    <rect x="19.5" y="16.3"  width="4.5" height="7.7"  fill="#F7F8F8"/>
  </g>
</svg>
