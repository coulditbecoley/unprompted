# Unprompted question bank: AI image generators
#
# The cleanest self-preference design in the publication. Only one of our three
# engines competes in this field: OpenAI makes DALL-E. Anthropic makes no image
# generator at all, and Perplexity makes none either.
#
# Two uncontaminated engines measuring one conflicted engine is the strongest
# version of this experiment we can construct. In the coding and writing
# categories the rival baseline is drawn from engines that also have a stake;
# here it is genuinely neutral.
#
# Human-owned. Editing this file is a methodology change and MUST bump the
# version below.
category: ai-image-generators
