# Unprompted question bank: AI writing tools
#
# The second field where the engines have a stake. Note the difference from AI
# coding assistants: there, the engine's *sibling product* competes (Claude the
# model vs Claude Code the tool). Here the engine itself IS the product — you
# can write with ChatGPT, so ChatGPT is a valid entry on this board.
#
# Perplexity is not really a writing tool, which is what makes this category
# work: it stays the neutral engine and provides the rival baseline the
# self-preference gap is measured against.
#
# Human-owned. Editing this file is a methodology change and MUST bump the
# version below.
