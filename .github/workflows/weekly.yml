name: Weekly run

# Tuesday 13:00 UTC. Runs in the cloud so the chart never depends on a laptop
# being awake: a missing week is worth far more damage than a late one.
on:
  schedule:
    - cron: "0 13 * * 2"
  workflow_dispatch:
    inputs:
      category:
        description: "Category to run"
        required: false
        default: "pokemon-grading"
      dry_run:
        description: "Run without writing any files"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-run
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Measure
        id: measure
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          python -m unprompted.run \
            --category "${{ inputs.category || 'pokemon-grading' }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
        continue-on-error: true

      # Exit code 2 means the sanity checks held the week. That is the design
      # working, not a broken job, which is why `continue-on-error` is set above
      # and the outcome is branched on rather than allowed to fail the build.

      - name: Publish
        if: steps.measure.outcome == 'success' && !inputs.dry_run
        run: |
          git config user.name "unprompted-bot"
          git config user.email "bot@unprompted.report"
          git add data/
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "Run $(date -u +%Y-%m-%d): measured and published"
            git push
          fi

      - name: Hold and notify
        if: steps.measure.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Week of ${date} held for review`,
              body: [
                'The weekly run did not pass its sanity checks, so nothing was published.',
                '',
                'This is the pipeline working as designed: it fails safe rather than',
                'publishing something wrong.',
                '',
                `[Full log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '',
                'Common causes:',
                '- An unrecognised brand name was quarantined. Add it to `aliases/` if real.',
                '- A brand moved more than 40 points week over week.',
                '- More than 20% of engine calls errored.',
                '- The brand count fell outside the expected range.',
              ].join('\n'),
              labels: ['held'],
            });
