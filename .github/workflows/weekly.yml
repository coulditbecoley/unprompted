name: Weekly run

# The schedule is deliberately off.
#
# Method v2 includes two local CLI harnesses as engines, signed in to the
# operator's machine. A GitHub runner cannot be signed in as the operator, so
# the pipeline's pre-flight refuses to start here and the job could only ever
# fail. The weekly measurement runs on that machine instead, via
# scripts\weekly-run.cmd and Windows Task Scheduler.
#
# This file is kept, not deleted: it still runs the hosted-only engine set on
# demand, and restoring the cron is the right move if the CLI engines are ever
# turned off again (which is itself a method version change).
on:
  workflow_dispatch:
    inputs:
      category:
        description: "Category slug, or 'all' for every live category"
        required: false
        default: "all"
      dry_run:
        description: "Run without writing any files"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-run
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    # Every category is measured in one job so the week lands as a single
    # commit. Categories run in sequence, roughly 20 minutes each, so the
    # ceiling has to clear the whole set with room to spare.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Measure
        id: measure
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          # Workflow inputs reach the shell as environment variables, never as
          # interpolated source. `${{ }}` is substituted before bash parses the
          # line, so a category string containing shell syntax would run as
          # shell syntax.
          CATEGORY: ${{ inputs.category || 'all' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          python -m unprompted.run \
            --category "$CATEGORY" \
            ${DRY_RUN:+--dry-run}
        continue-on-error: true

      # Exit code 2 means the sanity checks held at least one category. That is
      # the design working, not a broken job, which is why `continue-on-error`
      # is set above and the outcome is branched on rather than failing.

      - name: Publish
        # Runs even when a category was held: holding one chart must not
        # withhold the rest of the week. This is safe because the hold decision
        # is made before anything is written — a held run lands in data/held,
        # which the site does not read — so committing data/ cannot publish it.
        if: always() && !inputs.dry_run
        run: |
          git config user.name "unprompted-bot"
          git config user.email "bot@unprompted.report"
          git add data/ reports/
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "Run $(date -u +%Y-%m-%d): measured and published"
            git push
          fi

      - name: Hold and notify
        if: steps.measure.outcome != 'success'
        uses: actions/github-script@v7
        env:
          # Hold reasons quote brand names extracted from model output, so they
          # are attacker-influenced text. Passed through the environment rather
          # than interpolated into this script, where a backtick or ${} would
          # otherwise be evaluated as JavaScript.
          HOLD_REASONS: ${{ steps.measure.outputs.reasons }}
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const reasons = (process.env.HOLD_REASONS ?? "").trim();
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Week of ${date} held for review`,
              body: [
                'At least one category did not pass its sanity checks, so that',
                'category was not published. Any category that passed is live.',
                '',
                reasons ? '```\n' + reasons + '\n```' : '',
                '',
                'This is the pipeline working as designed: it fails safe rather',
                'than publishing something wrong.',
                '',
                `[Full log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '',
                'Common causes:',
                '- An unrecognised brand name was quarantined. Add it to `aliases/` if real.',
                '- A brand moved more than 40 points week over week.',
                '- More than 20% of engine calls errored.',
                '- The brand count fell outside the expected range.',
                '- The engine list changed without a method version bump.',
                '',
                'The held run is committed under `data/held/` with its answers intact.',
                'Fix the cause, then re-read it with `python -m unprompted.reextract`.',
              ].join('\n'),
              labels: ['held'],
            });
