name: CI

# The pipeline had a full test suite and nothing ever ran it. Both halves of the
# project are checked here, on every push and every pull request, so a change
# that breaks the publish gate or the shared metric fails before a Monday run
# reaches the site.
on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes: actions are pinned to commits and the token can only read.
permissions:
  contents: read

jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.lock -e .
      - name: Exercise the real cmd launcher without paid calls
        run: python -m pytest -q tests/test_weekly_launcher.py

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.lock -e .
      - name: Dependency advisories
        # The Python half of what npm audit does for the web job.
        run: pip install pip-audit==2.10.1 && pip-audit -r requirements.lock --no-deps --progress-spinner off
      - name: Test
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Python for metric agreement checks
        run: python -m pip install -r requirements.lock -e .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Dependency advisories
        run: npm audit --omit=dev
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Held weeks ship with admin only
        run: node scripts/check-traces.mjs
