# Brand canonicalisation for AI image generators.

canonical:
  Midjourney:
    - midjourney
    - mid journey
  DALL-E:
    - dall-e
    - dalle
    - dall e
    - dall-e 3
    - openai dall-e
    - gpt image
    - gpt-image-1
  Stable Diffusion:
    - stable diffusion
    - stability ai
    - sdxl
    - sd3
  Flux:
    - flux
    - black forest labs
    - flux.1
  Ideogram:
    - ideogram
  Adobe Firefly:
    - firefly
    - adobe firefly
    - adobe
  Imagen:
    - imagen
    - google imagen
    - gemini image
    - nano banana
  Leonardo AI:
    - leonardo
    - leonardo ai
  Recraft:
    - recraft
  Krea:
    - krea
    - krea ai
  Freepik:
    - freepik
  Canva:
    - canva
    - canva magic media
  Playground AI:
    - playground
    - playground ai
  NightCafe:
    - nightcafe
  Bing Image Creator:
    - bing image creator
    - microsoft designer
    - image creator

# Only OpenAI competes here. Anthropic makes no image generator and neither
# does Perplexity, so both act as genuinely neutral baselines — which is what
# makes this the cleanest self-preference measurement in the publication.
#
# Imagen is Google's, and Google is not one of our engines, so it is charted as
# a brand but carries no affiliation: with no owning engine present there is
# nothing to compare against.
affiliations:
  DALL-E: chatgpt

exclude:
  # Companies rather than products
  - openai
  - anthropic
  - google
  - microsoft
  - stability
  # Interfaces and runtimes rather than generators
  - comfyui
  - automatic1111
  - a1111
  - invoke ai
  - draw things
  - hugging face
  - replicate
  - civitai
  # Adjacent tooling
  - photoshop
  - figma
  - chatgpt
  - claude
  - gemini
  - perplexity
