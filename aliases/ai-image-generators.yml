# Only OpenAI competes here. Anthropic makes no image generator and neither
# does Perplexity, so both act as genuinely neutral baselines — which is what
# makes this the cleanest self-preference measurement in the publication.
#
# Imagen is Google's, and Google is not one of our engines, so it is charted as
# a brand but carries no affiliation: with no owning engine present there is
# nothing to compare against.
affiliations:
  # Every engine whose vendor makes it, so a second OpenAI engine does not get
  # counted as a neutral rival of the first. See aggregate.load_affiliations.
  DALL-E: [chatgpt, codex]

exclude:
  # Companies rather than products
  - openai
  - anthropic
  - google
  - microsoft
  - stability
  - bytedance
  - tencent
  # Cloud platforms and API surfaces. The generator is reached through them;
  # they are not the thing a shopper chooses.
  - vertex ai
  - google vertex ai
  - google cloud
  - azure openai
  - azure
  - gemini api
  - openai api
  - diffusers
  # Video, not images. A real answer to a different question.
  - google flow
  - flow
  - ltx studio
  - creatify
  - sora
  - runway
  - premiere
  - adobe premiere
  # Interfaces and runtimes rather than generators
  - comfyui
  - automatic1111
  - a1111
  - controlnet
  - ip-adapter
  - ipadapter
  - lora
  - invoke ai
  - draw things
  - hugging face
  - replicate
  - civitai
  # Adjacent tooling
  - photoshop
  - figma
  - chatgpt
  - claude
  - gemini
  - perplexity
  # Stock libraries. Named constantly as somewhere to get an image, which is a
  # real answer to the shopper's question and still not a generator.
  - getty images
  - getty images generative ai
  - shutterstock
  - shutterstock ai
  - envato
  - adobe stock
  - istock
  # Editors and retouchers. They increasingly bolt on generation, but the thing
  # being chosen is an editor, and charting them would make the field meaningless.
  - adobe photoshop
  - illustrator
  - adobe illustrator
  - adobe express
  - express
  - creative cloud
