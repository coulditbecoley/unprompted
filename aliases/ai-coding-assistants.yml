# Brand canonicalisation for AI coding assistants.
#
# Note on scope: we chart the *tool a developer chooses*, not the underlying
# model. "Claude" answering "use Claude" is a model, not a coding assistant;
# "Claude Code" is the product. Keeping those separate is what makes the
# self-preference question answerable rather than muddy.

canonical:
  Claude Code:
    - claude code
    - claude-code
    - anthropic claude code
  GitHub Copilot:
    - copilot
    - github copilot
    - gh copilot
    - copilot workspace
    - github copilot workspace
    # Surfaces of the same product. Tier and CLI suffixes fold automatically in
    # normalize.py; a two-word surface like "code review" cannot, because
    # "code" and "review" are load-bearing elsewhere ("Claude Code", and the
    # dedicated review tools charted below).
    - github copilot code review
    - copilot code review
    - github copilot coding agent
    - copilot coding agent
    - github copilot chat
    - copilot chat
  Cursor:
    - cursor
    - cursor ai
    - cursor ide
    - cursor editor
    # Cursor's own code-review bot, named as a Cursor feature rather than a
    # rival product.
    - cursor bugbot
    - bugbot
  Codex:
    - codex
    - openai codex
    - codex cli
    - chatgpt codex
  Windsurf:
    - windsurf
    - codeium windsurf
    - codeium
  Cline:
    - cline
    - claude dev
  Aider:
    - aider
    - aider chat
  Zed:
    - zed
    - zed editor
  JetBrains AI:
    - jetbrains ai
    - jetbrains ai assistant
    - intellij ai
  Amazon Q:
    - amazon q
    - amazon q developer
    - aws codewhisperer
    - codewhisperer
  Gemini Code Assist:
    - gemini code assist
    - google gemini code assist
    - google code assist
    - gemini cli
    - google gemini cli
  Tabnine:
    - tabnine
  Replit Agent:
    - replit
    - replit agent
    - replit ai
  Devin:
    - devin
    - cognition devin
    # Cognition is a one-product company here, and the engines write "Devin by
    # Cognition" as often as "Devin". Aliased rather than excluded as a company
    # name, because excluding it would silently drop a real Devin mention.
    - cognition
    - devin by cognition
  Sourcegraph Cody:
    - cody
    - sourcegraph cody
    - sourcegraph
  Continue:
    - continue
    - continue dev
  Augment:
    - augment
    - augment code
  Qodo:
    - qodo
    - codiumai
    - codium ai

  # Added 2026-08-25. Each of these was named often enough to hold the week and
  # was checked against the sentences it appeared in before being charted, not
  # recognised from the name alone.
  #
  # Dedicated pull-request reviewers. A distinct job from an in-editor
  # assistant, but the same question -- which tool does the engine name -- and
  # the engines answer with these constantly.
  CodeRabbit:
    - coderabbit
    - coderabbit ai
  Greptile:
    - greptile
  # Open-source agents. Named as the self-hosted answer in almost every run.
  OpenHands:
    - openhands
    - open hands
    - opendevin
    - open devin
  OpenCode:
    - opencode
    - open code
    - sst opencode
  Roo Code:
    - roo code
    - roocode
    - roo cline
  # Browser-based app builder. Charted for consistency with Replit Agent, which
  # is the same kind of product and already on the chart.
  Playcode AI:
    - playcode
    - playcode ai

# Which engine's own house each product belongs to.
#
# This is why the category exists. We query ChatGPT, Claude and Perplexity, and
# two of the products below are made by two of those companies. With this map we
# can ask whether an engine names its own tool more often than rivals name it —
# a question no competing tool can answer, because none of them query multiple
# engines and compare.
#
# The engine names match the pipeline's own (chatgpt, claude, perplexity).
# Brand -> every engine whose vendor makes it. A list because one vendor can
# field more than one engine: Anthropic answers as both the hosted `claude` API
# and, where registered, the local `claude-code` harness. Listing only the first
# would count the second as a neutral rival and shrink the measured gap.
affiliations:
  Claude Code: [claude, claude-code]
  Codex: [chatgpt, codex]

# Known, and deliberately not charted. Real things the engines name while
# answering, but not coding assistants, so charting them would be wrong.
exclude:
  # Underlying models rather than the tool a developer chooses
  - gpt-5
  - gpt-4
  - gpt-4o
  - claude opus
  - claude sonnet
  - claude 3.5 sonnet
  # The model, not the tool. The note at the top of this file is the whole
  # reason the category is answerable: "Claude" is what Claude Code runs on,
  # and charting both would double-count Anthropic against itself.
  - claude
  - anthropic claude
  - gemini
  - gemini 2.5 pro
  - llama
  - deepseek
  - qwen
  - mistral
  - o3
  - o1
  # Editors and platforms without an AI-assistant claim in scope
  - vs code
  - visual studio code
  - visual studio
  - intellij
  - pycharm
  # The IDE family and the company. "JetBrains AI" is the charted product;
  # bare "JetBrains" is always "if you live in JetBrains IDEs".
  - jetbrains
  - neovim
  - vim
  - emacs
  - github
  - gitlab
  # Companies rather than products
  - openai
  - anthropic
  - google
  - microsoft
  - amazon
  - meta
  # Local model runtimes. Named as how you run a model, not as the assistant
  # itself: "DeepSeek-Coder-V2 via Ollama", "or run locally via Ollama".
  - ollama
  - lm studio
  - llama.cpp
  - vllm
  - openrouter
  # Adjacent tooling
  - stack overflow
  - chatgpt
  - perplexity
  - notion
  - linear
